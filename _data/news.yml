- date: 5/7/26
  title: "Celebrating Our 2026 Graduates"
  images: 
    - "news/group_graduation_2026.jpg"
    - "news/joseph_graduation_2026.jpg"
    - "news/anway_sarker_graduation_2026.jpg"
    - "news/anway_graduation_2026.jpg"
    - "news/sarker_graduation_2026.jpg"
    - "news/serena_graduation_2026.jpg"
    - "news/kelly_graduation_2026.jpg"
  tags:
    - Class of 2026
    - Graduation
    - Student Success
    - Engineering
    - Future Leaders
  content: >
    Congratulations to our 2026 graduates:
    Joseph Amato, Anway Bose, Sarker Mohammad, Ying-Ting (Serena) Wu, and Yi Hsuan (Kelly) Huang 
    on reaching this important academic milestone. We are proud to celebrate the achievements of 
    these talented individuals as they graduate with their degrees in engineering. Each of them 
    has made significant contributions to the field of engineering, and we are excited to see the 
    impact they will have in their future careers. Through dedication, hard work, and perseverance, 
    they have successfully completed their academic journey and are prepared for the next chapter 
    of their careers and future endeavors. We celebrate their achievements and wish them continued success ahead.


- date: 5/1/26
  title: "Sarker Mohammad Successfully Defended His Master's Project"
  images:
    - "news/sarker_2026_master_1.jpg"
    - "news/sarker_2026_master_2.jpg"
  tags:
    - Master's Defense
    - AI
    - Cybersecurity
    - Fully Homomorphic Encryption
  content: >
    Sarker Mohammad successfully defended his master project, 
    "FHE Flower Project: Integrating Fully Homomorphic Encryption into the Flower Federated Learning Framework",
    which focuses on developing on enchancing privacy and security in federated learning systems 
    through advanced encryption techniques. He demonstrated strong innovation and dedication throughout the work. 
    Congratulations to Sarker Mohammad on this important academic milestone. 
    (Pictures of Sarker Mohammad, Dr. Li Bai and Dr. Chiu Tan)

- date: 4/29/26
  title: "Ying-Ting (Serena) Wu Successfully Defended Her Master's Project"
  images: 
    - "news/yingting_2026_master_1.jpg"
    - "news/yingting_2026_master_2.jpg"
  tags:
    - Master's Defense
    - AI
    - Chatbot
    - Multi-Agents Systems
    - Mental Health Tech
  content: >
    Ying-Ting (Serena) Wu successfully defended her master project,
    "A Multi-Agent Counseling Chatbot System for Active Thinking",
    which focuses on developing an AI driven system that use multi-agents chatbot 
    to support interactive and reflective thinking in counseling-style conversations. 
    She demonstrated strong innovation and dedication throughout the work. 
    Congratulations to Ying-Ting Wu on this important academic milestone.
    (Pictures of Ying-Ting Wu, Dr. Li Bai and Dr. Xu Jiang)

- date: 4/29/26
  title: "Yi Hsuan (Kelly) Huang Successfully Defended Her Master's Project"
  images:
    - "news/yihsuan_2026_master_1.jpg"
    - "news/yihsuan_2026_master_2.jpg"
  tags:
    - Master's Defense
    - Renewable Energy
    - Energy Management
  content: > 
    Yi Hsuan Huang successfully defended her master project, 
    "Revidyne Energy Device Manager - An Interactive Platform for Energy Device Control, Allocation, and Learning",
    which focuses on improving energy system management through an intelligent and interactive platform. 
    She demonstrated strong innovation and dedication throughout the work. 
    Congratulations to Yi Hsuan Huang on this important academic milestone. 
    (Pictures of Yi Hsuan Huang, Dr. Li Bai and Dr. Saroj K, Biswas)
    

