- date:  9/3/25
  title: "Dr. Joseph Amato Successfully Defended His PhD Dissertation"
  images:
    - "news/joe_2025.jpg"
  tags:
    - PhD Defense
    - Power Systems
    - Federated Learning
    - Shipboard Power
  content: >
    [Joseph Amato](/team/joe-amato) successfully defended his PhD dissertation,
    "Towards Secure and Decentralized Energy Dispatch: Fuel Optimization Using Distributed Learning
    for Energy Demand and Storage Strategies". His research focuses on privacy-preserving federated
    optimization for multi-agent systems, with applications to shipboard power systems, and was
    sponsored by the Department of the Navy. Congratulations, Dr. Amato!

