- date: 5/1/26
  title: "Sarker Mohammed Successfully Defended His Master's Project"
  images:
    - "news/sarker_2026_master_1.jpg"
    - "news/sarker_2026_master_2.jpg"
  tags:
    - "Master's Defense"
    - Federated Learning
    - Homomorphic Encryption
    - Cybersecurity
  content: >
    [Sarker Mohammed](/team/sarker) successfully defended his master's project,
    "FHE Flower Project: Integrating Fully Homomorphic Encryption into the Flower Federated Learning Framework",
    which focuses on developing ways to enhance privacy and security in federated learning systems
    through advanced encryption techniques. He demonstrated exceptional technical depth and a
    strong commitment to advancing secure AI systems throughout the project.
    Congratulations to Sarker Mohammed on this important academic milestone.
    (Pictured: Sarker Mohammed, [Dr. Li Bai](/team/bai-li) and Dr. Chiu Tan)

- date: 4/29/26
  title: "Ying-Ting (Serena) Wu Successfully Defended Her Master's Project"
  images:
    - "news/yingting_2026_master_1.jpg"
    - "news/yingting_2026_master_2.jpg"
  tags:
    - "Master's Defense"
    - AI
    - Multi-Agent Systems
    - Mental Health
  content: >
    [Ying-Ting Wu](/team/serena-wu) successfully defended her master's project,
    "A Multi-Agent Counseling Chatbot System for Active Thinking",
    which focuses on developing an AI driven system that use multi-agents chatbot 
    to support interactive and reflective thinking in counseling-style conversations.
    She demonstrated outstanding creativity, technical excellence, and a remarkable
    ability to design AI systems that promote meaningful and engaging human-centered interactions.
    Congratulations to Ying-Ting Wu on this important academic milestone.
    (Pictured: Ying-Ting Wu, [Dr. Li Bai](/team/bai-li) and Dr. Xu Jiang)

- date: 4/29/26
  title: "Yi Hsuan (Kelly) Huang Successfully Defended Her Master's Project"
  images:
    - "news/yihsuan_2026_master_1.jpg"
    - "news/yihsuan_2026_master_2.jpg"
  tags:
    - "Master's Defense"
    - Energy Management
    - Renewable Energy
  content: >
    [Yi Hsuan Huang](/team/kelly-huang) successfully defended her master's project,
    "Revidyne Energy Device Manager - An Interactive Platform for Energy Device Control, Allocation, and Learning",
    which focuses on improving energy system management through an intelligent and interactive platform.
    She demonstrated excellent problem-solving skills and a strong ability to develop practical solutions for modern energy systems.
    Congratulations to Yi Hsuan Huang on this important academic milestone.
    (Pictured: Yi Hsuan Huang, [Dr. Li Bai](/team/bai-li) and Dr. Saroj K. Biswas)


- date: 2/1/26
  title: "Dr. Joseph Amato's Paper Accepted at the Texas Power and Energy Conference (TPEC) 2026"
  images:
    - "news/tpec.jpg"
  tags:
    - Conference Paper
    - Power Systems
    - Microgrids
    - Optimization
  content: >
    The paper "Decentralized Optimization in Multi-Microgrid Networks: Optimizing Fuel Costs
    Using Consensus-Based ADMM" by [Dr. Joseph Amato](/team/joe-amato), [Anway Bose](/team/bose-anway)
    and [Dr. Li Bai](/team/bai-li) was accepted at the Texas Power and Energy Conference (TPEC) 2026.
    The work coordinates fuel use across a network of microgrids without a central controller,
    using a consensus-based ADMM optimization method.
    Anway Bose presented the paper at the conference on February 8, 2026.

- date: 12/1/25
  title: "Chris Pullen Successfully Defended His Master's Project"
  images:
    - "news/chris_2025.jpg"
  tags:
    - "Master's Defense"
    - Robotics
    - STEM Education
  content: >
    [Chris Pullen](/team/chris-pullen) successfully defended his master's project,
    "A Low-Cost Quadruped Robot Dog for K-12 STEM Education", which presents an affordable,
    four-legged robot designed for easy assembly so that K-12 students can build it and learn from it.
    Congratulations to Chris Pullen on this milestone.
    (Pictured: Chris Pullen, Cory Zwerlein and [Dr. Li Bai](/team/bai-li))

- date: 11/20/25
  title: "Kyle McGinley Wins the 2025 Butz Scholarship"
  images:
    - "news/kyle_2025.jpg"
  tags:
    - Award
    - Scholarship
    - Undergraduate Research
  content: >
    Congratulations to [Kyle McGinley](/team/kyle-mcginley), an undergraduate student in
    Electrical and Computer Engineering and a research assistant in CFL, on being named the
    [2025 Butz Scholarship Winner](https://engineering.temple.edu/news/2025/11/2025-butz-scholarship-winner-kyle-mcginley).
