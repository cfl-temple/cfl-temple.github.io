<div class="navbar navbar-default navbar-fixed-top" role="navigation">
  <div class="container-fluid">
	<div class="navbar-header">
	  <button type="button" class="navbar-toggle collapsed" data-toggle="collapse" data-target="#navbar-collapse-1" aria-expanded="false">
		<span class="sr-only">Toggle navigation</span>
		<span class="icon-bar"></span>
		<span class="icon-bar"></span>
		<span class="icon-bar"></span>
	  </button>

    <a class="navbar-brand brand-logos" href="{{ site.baseurl }}/">
      {% assign temple_logo = site.static_files | where_exp: "file", "file.path contains 'temple'" | first %}
      {% if temple_logo %}
      <img src="{{ site.baseurl }}{{ temple_logo.path }}" alt="Temple University" class="brand-logo brand-logo-temple">
      {% else %}
      <span class="brand-logo brand-logo-temple brand-logo-placeholder" title="Drop a file named like 'temple-logo.png' into images/logo/ to replace this">TU</span>
      {% endif %}
      <span class="brand-title">{{ site.title }}</span>
    </a>
	</div>
	<div class="collapse navbar-collapse" id="navbar-collapse-1">
	  <ul class="nav navbar-nav navbar-right">
		<li><a href="{{ site.baseurl }}/">Home</a></li>

		<li><a href="{{ site.baseurl }}/research">Research</a></li>
		<li><a href="{{ site.baseurl }}/publications">Publications</a></li>
		<li><a href="{{ site.baseurl }}/software">Software</a></li>
	  </ul>
	</div>
  </div>
</div>
